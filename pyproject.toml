[project]
name = "signalpost"
version = "0.1.0"
description = "Agent that builds sourced, dated company profiles from a Norwegian organisasjonsnummer"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
signalpost = "signalpost.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signalpost*"]
